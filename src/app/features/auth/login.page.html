<h1 class="text-2xl font-bold mb-4">Login</h1>

<form (ngSubmit)="onLoginSuccess()">
  <input type="email" placeholder="Email" class="border p-2 rounded w-full mb-2" />
  <input type="password" placeholder="Password" class="border p-2 rounded w-full mb-4" />
  <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg">Login</button>
</form>
